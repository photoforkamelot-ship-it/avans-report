<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Письмо на согласование</title>
<style>
  :root {
    --primary: #007aff; --bg: #f2f2f7; --text: #1c1c1e; --card: #ffffff;
    --border: #d1d1d6; --muted: #6c6c70; --ok: #1f8a4c; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --text: #f2f2f7; --card: #1c1c1e; --border: #3a3a3c; --muted: #98989f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .subject { font-weight: 600; line-height: 1.35; word-break: break-word; }
  .body { white-space: pre-wrap; line-height: 1.5; word-break: break-word; font-size: 15px; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 600;
    text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--primary); border: 1px solid var(--border); }
  .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .status { font-size: 14px; min-height: 20px; margin: 4px 0 10px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Письмо на согласование</h1>

  <div id="loading" class="note">Загружаю письмо…</div>
  <div id="error" class="card" hidden>
    <div class="subject" id="errorTitle">Не удалось открыть письмо</div>
    <p class="note" id="errorText"></p>
  </div>

  <div id="content" hidden>
    <div class="card">
      <div class="label">Тема</div>
      <div class="subject" id="subject"></div>
    </div>
    <div class="card">
      <div class="label">Текст письма</div>
      <div class="body" id="body"></div>
    </div>

    <a id="mailBtn" class="btn btn-primary" href="#">Открыть в почте</a>
    <button id="copyBodyBtn" class="btn btn-secondary" type="button">Скопировать текст письма</button>
    <button id="copySubjectBtn" class="btn btn-secondary" type="button">Скопировать тему</button>
    <div id="status" class="status" role="status"></div>
    <p class="note">Если почта не открылась, скопируйте тему и текст и вставьте их в новое письмо. Вложения (заявки) прикрепите вручную.</p>
  </div>
</div>

<script>
  var API = "https://script.google.com/macros/s/AKfycbwqfeeX8q61tkVz0Rhubm2hu14O7vOPhu40r9qx6IOR78adJUq_U3CNwGtx6CfF-3oItQ/exec";

  var el = function (id) { return document.getElementById(id); };
  var mail = { subject: "", body: "" };

  function showError(title, text) {
    el("loading").hidden = true;
    el("content").hidden = true;
    el("errorTitle").textContent = title;
    el("errorText").textContent = text;
    el("error").hidden = false;
  }

  function setStatus(text, isErr) {
    var s = el("status");
    s.textContent = text;
    s.className = "status " + (isErr ? "err" : "ok");
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      setStatus(ok ? okMsg : "Не удалось скопировать. Выделите текст вручную.", !ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { setStatus(okMsg, false); }, fallback);
    } else { fallback(); }
  }

  function render(data) {
    mail.subject = data.subject || "";
    mail.body = data.body || "";
    el("subject").textContent = mail.subject;
    el("body").textContent = mail.body;
    el("mailBtn").href = "mailto:?subject=" + encodeURIComponent(mail.subject) + "&body=" + encodeURIComponent(mail.body);
    el("loading").hidden = true;
    el("content").hidden = false;
  }

  el("copyBodyBtn").addEventListener("click", function () { copyText(mail.body, "Текст письма скопирован"); });
  el("copySubjectBtn").addEventListener("click", function () { copyText(mail.subject, "Тема скопирована"); });

  (function init() {
    var reqId = new URLSearchParams(window.location.search).get("req");
    if (!reqId) { showError("Нет номера заявки", "Откройте ссылку из сообщения бота ещё раз."); return; }

    fetch(API + "?action=get_mail&reqId=" + encodeURIComponent(reqId))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok && data.body) { render(data); }
        else { showError("Письмо не найдено", "Заявка " + reqId + " отсутствует в реестре или у неё нет сохранённого текста письма."); }
      })
      .catch(function () {
        showError("Нет связи с сервером", "Проверьте интернет и откройте ссылку ещё раз.");
      });
  })();
</script>
</body>
</html>
